[project]
name = "medextract"
version = "0.2.0"
description = "Clinical note -> validated structured JSON + ICD-10 candidate codes."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["medextract"]
ignore_missing_imports = true
